version: 2
updates:
  # Runtime and dev dependencies: one grouped pull request a week instead of a stream of small ones.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions are upgrades to plan, not to merge from a bot: TypeScript 7 is not supported by
    # typescript-eslint yet and Tailwind 4 changes its configuration format.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
